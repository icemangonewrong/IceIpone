name: Build CarPlex

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          brew install ldid || {
            curl -fsSL -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
            chmod +x ldid
            sudo mv ldid /usr/local/bin/ldid
          }

      - name: Generate Xcode project
        run: xcodegen generate

      # The VLC package is large (~780 MB); keep it between builds so it only downloads once.
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ hashFiles('project.yml') }}

      - name: Build app (no signing)
        run: |
          set -o pipefail
          xcodebuild -project CarPlex.xcodeproj \
            -scheme CarPlex \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/CarPlex.app

      - name: Show errors
        if: failure()
        run: |
          grep -E " error: " build.log | sort -u | head -40 || true

      - name: Package Feather IPA (sign with your Arctic cert)
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CarPlex.app Payload/
          zip -qry CarPlex.ipa Payload

      - name: Package CarPlay IPA (for TrollStore / jailbreak)
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/CarPlex.app Payload/
          ldid -SCarPlex-CarPlay.entitlements Payload/CarPlex.app/CarPlex
          zip -qry CarPlex-CarPlay.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: CarPlex-ipas
          path: |
            CarPlex.ipa
            CarPlex-CarPlay.ipa
