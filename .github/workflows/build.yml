name: Build IcePlex (iPhone)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          brew install ldid || {
            curl -fsSL -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
            chmod +x ldid
            sudo mv ldid /usr/local/bin/ldid
          }

      - name: Generate Xcode project
        run: xcodegen generate

      # The VLC package is large (~780 MB); keep it between builds so it only downloads once.
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-vlckit-3.6.0

      - name: Build app (no signing)
        run: |
          set -o pipefail
          xcodebuild -project IcePlex.xcodeproj \
            -scheme IcePlex \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/IcePlex.app

      # Turn compiler errors into GitHub annotations so they're readable without the full log.
      - name: Show errors
        if: failure()
        run: |
          grep -E " error: " build.log | sort -u | head -40 > errors.txt || true
          cat errors.txt
          while IFS= read -r line; do
            f=$(echo "$line" | sed -E 's#^.*/(Sources/[^:]+):([0-9]+):.*$#\1#')
            l=$(echo "$line" | sed -E 's#^.*/Sources/[^:]+:([0-9]+):.*$#\1#')
            msg=$(echo "$line" | sed -E 's#^.* error: ##')
            echo "::error file=$f,line=$l::$f:$l $msg"
          done < errors.txt

      - name: Package Feather IPA (sign with your Arctic cert)
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/IcePlex.app Payload/
          zip -qry IcePlex.ipa Payload

      - name: Package CarPlay IPA (for TrollStore / jailbreak)
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/IcePlex.app Payload/
          ldid -SIcePlex-CarPlay.entitlements Payload/IcePlex.app/IcePlex
          zip -qry IcePlex-CarPlay.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IcePlex-ipas
          path: |
            IcePlex.ipa
            IcePlex-CarPlay.ipa
