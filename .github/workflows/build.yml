name: Build Ice (iPhone)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          brew install ldid || {
            curl -fsSL -o ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
            chmod +x ldid
            sudo mv ldid /usr/local/bin/ldid
          }

      - name: Generate Xcode project
        run: xcodegen generate

      # The VLC package is large (~780 MB); keep it between builds so it only downloads once.
      - name: Cache packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-vlckit-3.6.0-v2

      - name: Build app (no signing)
        run: |
          set -o pipefail
          xcodebuild -project Ice.xcodeproj \
            -scheme Ice \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -f build/Build/Products/Release-iphoneos/Ice.app/Ice && test -f build/Build/Products/Release-iphoneos/Ice.app/Info.plist

      # Turn compiler errors into GitHub annotations so they're readable without the full log.
      - name: Show errors
        if: failure()
        run: |
          grep -E " error: " build.log | sort -u | head -40 > errors.txt || true
          # Anything else that looks like a failure (shown as plain annotations)
          grep -E "error:|\*\* BUILD FAILED|Command .* failed|fatal" build.log | grep -v " error: " | sort -u | head -20 | while IFS= read -r line; do
            echo "::error::$(echo "$line" | cut -c1-400)"
          done
          echo "--- last lines ---"; tail -40 build.log
          cat errors.txt
          while IFS= read -r line; do
            f=$(echo "$line" | sed -E 's#^.*/(Sources/[^:]+):([0-9]+):.*$#\1#')
            l=$(echo "$line" | sed -E 's#^.*/Sources/[^:]+:([0-9]+):.*$#\1#')
            msg=$(echo "$line" | sed -E 's#^.* error: ##')
            echo "::error file=$f,line=$l::$f:$l $msg"
          done < errors.txt

      - name: Package Feather IPA (sign with your Arctic cert)
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Ice.app Payload/
          zip -qry Ice.ipa Payload

      - name: Package CarPlay IPA (for TrollStore / jailbreak)
        run: |
          set -o pipefail
          {
            set -ex
            rm -rf Payload && mkdir Payload
            cp -R build/Build/Products/Release-iphoneos/Ice.app Payload/
            ls -la Payload/Ice.app | head -40
            file Payload/Ice.app/Ice
            # Ad-hoc sign with the CarPlay video permission (TrollStore keeps these permissions).
            if [ -d Payload/Ice.app/Frameworks ]; then
              find Payload/Ice.app/Frameworks -maxdepth 1 \( -name "*.framework" -o -name "*.dylib" \) -exec codesign --force --sign - {} \;
            fi
            codesign --force --sign - --entitlements Ice-CarPlay.entitlements --generate-entitlement-der Payload/Ice.app
            codesign -d --entitlements - Payload/Ice.app 2>&1 | grep carplay-video
            zip -qry Ice-CarPlay.ipa Payload
          } > carplay.log 2>&1 || {
            cat carplay.log
            tail -25 carplay.log | while IFS= read -r line; do echo "::error::$(echo "$line" | cut -c1-300)"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Ice-ipas
          path: |
            Ice.ipa
            Ice-CarPlay.ipa

      # Publish each build from main as a GitHub Release (easy to download on a phone).
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          git log -1 --pretty=%B > notes.txt
          gh release create "$tag" Ice.ipa Ice-CarPlay.ipa --title "Ice for iPhone (build ${{ github.run_number }})" --notes-file notes.txt --latest
